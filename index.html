  // Camada de armazenamento local (substitui o window.storage do ambiente Claude
  // por um equivalente baseado em localStorage, para este arquivo funcionar
  // sozinho em qualquer hospedagem).
  (function () {
    function fullKey(key, shared) { return "clmodas:" + (shared ? "shared" : "local") + ":" + key; }
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem(fullKey(key, shared));
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(fullKey(key, shared), value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem(fullKey(key, shared));
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const p = "clmodas:" + (shared ? "shared" : "local") + ":" + (prefix || "");
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice(("clmodas:" + (shared ? "shared" : "local") + ":").length));
        }
        return { keys, prefix, shared: !!shared };
      },
    };
  })();
</script>
